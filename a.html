<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bulmaca Çarkı — Arkadaş Daveti</title>
<meta property="og:title" content="Bulmaca Çarkı'nda düelloya davet edildin! ⚔️">
<meta property="og:description" content="Linke dokun, arkadaş olun ve online düelloda kapışın.">
<meta property="og:image" content="https://mubbo1.github.io/bulmaca-carki/icons/icon-512.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;
    background:radial-gradient(circle at 50% 0%,#7b2cbf,#3c096c 55%,#10002b);display:flex;align-items:center;justify-content:center;padding:24px}
  .c{max-width:380px;width:100%;text-align:center}
  img{width:110px;height:110px;border-radius:26px;box-shadow:0 10px 30px #0008}
  h1{font-size:24px;margin:18px 0 6px}
  p{opacity:.85;line-height:1.45;margin:0 0 18px}
  a.b{display:block;text-decoration:none;font-weight:800;font-size:17px;padding:15px;border-radius:16px;margin:10px 0}
  .y{background:#ffb703;color:#1b262c;box-shadow:0 5px 0 #b07a00}
  .w{background:#ffffff1f;color:#fff;border:1.5px solid #ffffff40}
  .code{margin-top:18px;background:#ffffff14;border-radius:14px;padding:12px;font-size:14px}
  .code b{display:block;font-size:28px;letter-spacing:6px;color:#ffd166;margin-top:4px}
</style>
</head>
<body>
<div class="c">
  <img src="icons/icon-512.png" alt="Bulmaca Çarkı">
  <h1 id="t">Düelloya davet edildin! ⚔️</h1>
  <p id="d">Bulmaca Çarkı'nda arkadaş olun ve online düelloda kapışın.</p>
  <a class="b y" id="open" href="#">🎡 Oyunu Aç ve Arkadaş Ol</a>
  <a class="b w" href="https://apps.apple.com/tr/app/id6835316819">📲 App Store'dan Ücretsiz İndir</a>
  <div class="code">Oyunu yeni indirdiysen: <br>Düello → 👥 Arkadaşınla Oyna → <b>Arkadaşlık kodu</b> kutusuna şu kodu yaz:<b id="k">——</b></div>
</div>
<script>
  const q=new URLSearchParams(location.search), c=(q.get("c")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6), n=(q.get("n")||"").slice(0,20);
  document.getElementById("k").textContent=c||"——";
  if(n){ document.getElementById("t").textContent=n+" seni düelloya davet ediyor! ⚔️"; }
  const app="bulmacacarki://f/"+c;
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const op=document.getElementById("open");
  op.href = isIOS ? app : "./?f="+c;
  if(!isIOS) op.textContent="🎡 Oyunu Aç ve Arkadaş Ol (web)";
  if(isIOS && c){ setTimeout(()=>{ location.href=app; },400); }
</script>
</body>
</html>
