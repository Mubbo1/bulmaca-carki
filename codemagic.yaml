  android-test:
    name: Android → deneme APK (imzasız, test için)
    working_directory: app
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Paketleri kur
        script: npm install
      - name: Oyunu uygulamaya koy
        script: npm run build:web
      - name: Android projesini oluştur
        script: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: İkon ve açılış ekranı
        script: npx @capacitor/assets generate --android --iconBackgroundColor '#5a189a' --splashBackgroundColor '#3c096c' --splashBackgroundColorDark '#3c096c'
      - name: AdMob kimliği ve dikey ekran
        script: |
          AID="${ADMOB_ANDROID_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          python3 - "$AID" <<'PY2'
          import sys,re
          aid=sys.argv[1]; p='android/app/src/main/AndroidManifest.xml'; s=open(p).read()
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s=re.sub(r'(<application[^>]*>)',r'\1\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'+aid+'"/>',s,1)
          s=re.sub(r'<activity\b(?![^>]*screenOrientation)',r'<activity android:screenOrientation="portrait"',s,1)
          open(p,'w').write(s); print('manifest hazır')
          PY2
      - name: Deneme APK oluştur
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
      - app/android/app/build/outputs/**/*.apk

  android-release:
    name: Android → .aab
    working_directory: app
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - bulmaca_keystore
      node: 22
      java: 21
    scripts:
      - name: Paketleri kur
        script: npm install
      - name: Oyunu uygulamaya koy
        script: npm run build:web
      - name: Android projesini oluştur
        script: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: İkon ve açılış ekranı
        script: npx @capacitor/assets generate --android --iconBackgroundColor '#5a189a' --splashBackgroundColor '#3c096c' --splashBackgroundColorDark '#3c096c'
      - name: AdMob kimliği ve dikey ekran
        script: |
          AID="${ADMOB_ANDROID_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          python3 - "$AID" <<'PY'
          import sys,re
          aid=sys.argv[1]; p='android/app/src/main/AndroidManifest.xml'; s=open(p).read()
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s=s.replace('<application','<application',1)
              s=re.sub(r'(<application[^>]*>)',r'\1\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'+aid+'"/>',s,1)
          s=re.sub(r'<activity\b(?![^>]*screenOrientation)',r'<activity android:screenOrientation="portrait"',s,1)
          open(p,'w').write(s); print('manifest hazır')
          PY
      - name: İmza ayarı (Codemagic keystore)
        script: |
          python3 - <<'PY'
          p='android/app/build.gradle'; s=open(p).read()
          if 'signingConfigs' not in s:
              s=s.replace('buildTypes {','''signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {''',1)
              s=s.replace('release {\n            minifyEnabled','release {\n            signingConfig signingConfigs.release\n            minifyEnabled',1)
          s=s.replace('versionCode 1','versionCode '+__import__('os').environ.get('BUILD_NUMBER','1'))
          open(p,'w').write(s); print('imza hazır')
          PY
      - name: Android paketini oluştur
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - app/android/app/build/outputs/**/*.aab
