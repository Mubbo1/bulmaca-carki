# Bulmaca Çarkı — Codemagic bulut derleme ayarları
# Uygulama projesi "app" klasöründe; oyunun kendisi depo kökündeki index.html (GitHub Pages ile aynı dosya).
# iOS: Mac gerekmez, Codemagic'in Mac'inde paketlenir ve App Store Connect'e (TestFlight) yüklenir.
# Android: imzalı .aab dosyası üretir (Google Play'e yüklenir).
#
# Codemagic panelinde bir kez yapılacaklar (app/README-TR.md):
#  1) App Store Connect entegrasyonu: Cube Traffic için açılan "CubeTrafficASC" aynen kullanılır
#  2) Code signing identities: aynı Apple Distribution sertifikası kullanılır
#  3) (Android) Android keystores: "bulmaca_keystore" adıyla keystore ekle
#  4) AdMob uygulama kimlikleri: ADMOB_IOS_APP_ID / ADMOB_ANDROID_APP_ID ortam değişkenleri
#     (boşsa Google'ın deneme kimlikleri kullanılır)

workflows:
  ios-release:
    name: iOS → TestFlight
    working_directory: app
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CubeTrafficASC
    environment:
      ios_signing:
        provisioning_profiles:
          - bulmaca_appstore_push
        certificates:
          - cube_dist
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Paketleri kur
        script: npm install
      - name: Oyunu uygulamaya koy
        script: npm run build:web
      - name: iOS projesini oluştur
        script: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      - name: Anlık bildirim (push) izni
        script: |
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>
          EOF
          ruby -e 'require "xcodeproj"; p=Xcodeproj::Project.open("ios/App/App.xcodeproj"); t=p.targets.find{|x| x.name=="App"}; t.build_configurations.each{|c| c.build_settings["CODE_SIGN_ENTITLEMENTS"]="App/App.entitlements"}; p.save'
          python3 - <<'PY'
          p='ios/App/App/AppDelegate.swift'; s=open(p).read()
          if 'capacitorDidRegisterForRemoteNotifications' not in s:
              add = "\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }\n"
              i = s.rindex('}'); s = s[:i] + add + s[i:]; open(p, 'w').write(s)
          print("push hazir")
          PY
          grep -c capacitorDidRegisterForRemoteNotifications ios/App/App/AppDelegate.swift
      - name: Sadece iPhone (iPad ekran görüntüsü gerekmesin)
        script: sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = 1/g' ios/App/App.xcodeproj/project.pbxproj && grep -m2 TARGETED_DEVICE_FAMILY ios/App/App.xcodeproj/project.pbxproj
      - name: En az iOS 15 (Apple ITMS-90068)
        script: |
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = 1[0-4]\.[0-9]+/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E "s/platform :ios, '1[0-4]\.[0-9]+'/platform :ios, '15.0'/" ios/App/Podfile
          cd ios/App && pod install
          grep -m1 IPHONEOS_DEPLOYMENT_TARGET App.xcodeproj/project.pbxproj
      - name: İkon ve açılış ekranı
        script: npx @capacitor/assets generate --ios --iconBackgroundColor '#5a189a' --splashBackgroundColor '#3c096c' --splashBackgroundColorDark '#3c096c'
      - name: Info.plist (AdMob, takip izni, dikey ekran)
        script: |
          PL=ios/App/App/Info.plist
          AID="${ADMOB_IOS_APP_ID:-ca-app-pub-4184102551865093~5579802063}"
          pb(){ /usr/libexec/PlistBuddy -c "$1" "$PL" 2>/dev/null || true; }
          pb "Delete :GADApplicationIdentifier"; pb "Add :GADApplicationIdentifier string $AID"
          pb "Delete :NSUserTrackingUsageDescription"
          pb "Add :NSUserTrackingUsageDescription string This lets us show you more relevant ads. Bu izin daha ilgili reklamlar göstermemizi sağlar."
          pb "Delete :ITSAppUsesNonExemptEncryption"; pb "Add :ITSAppUsesNonExemptEncryption bool false"
          pb "Delete :UISupportedInterfaceOrientations"; pb "Add :UISupportedInterfaceOrientations array"; pb "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait"
          pb "Delete :UISupportedInterfaceOrientations~ipad"; pb "Add :UISupportedInterfaceOrientations~ipad array"; pb "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait"; pb "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown"
          pb "Delete :UIRequiresFullScreen"; pb "Add :UIRequiresFullScreen bool true"
          pb "Delete :SKAdNetworkItems"; pb "Add :SKAdNetworkItems array"
          i=0; for n in cstr6suwn9 4fzdc2evr5 2fnua5tdw4 ydx93a7ass p78axxw29g v72qych5uu ludvb6z3bs cp8zw746q7 3sh42y64q3 c6k4g5qg8m s39g8k73mm 3qy4746246 hs6bdukanm mlmmfzh3r3 v4nxqhlyqp wzmmz9fp6w su67r6k2v3 yclnxrl5pm 7ug5zh24hu gta9lk7p23 vutu7akeur y5ghdn5j9k v9wttpbfk9 n38lu8286q 47vhws6wlr kbd757ywx3 9t245vhmpl a2p9lx4jpn 22mmun2rn5 44jx6755aq k674qkevps 4468km3ulz 2u9pt9hc89 8s468mfl3y klf5c3l5u5 ppxm28t8ap kbmxgpxpgc uw77j35x4d 578prtvx9j 4dzt52r2t5 tl55sbb4fm c3frkrj4fj e5fvkxwrpn 8c4e2ghe7u 3rd42ekr43 97r2b46745 3qcr597p9d; do
            pb "Add :SKAdNetworkItems:$i dict"; pb "Add :SKAdNetworkItems:$i:SKAdNetworkIdentifier string $n.skadnetwork"; i=$((i+1)); done
          pb "Delete :CFBundleURLTypes"; pb "Add :CFBundleURLTypes array"; pb "Add :CFBundleURLTypes:0 dict"; pb "Add :CFBundleURLTypes:0:CFBundleURLName string com.bulmacacarki.link"; pb "Add :CFBundleURLTypes:0:CFBundleURLSchemes array"; pb "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string bulmacacarki"
          pb "Delete :CFBundleDevelopmentRegion"; pb "Add :CFBundleDevelopmentRegion string tr"
          pb "Delete :CFBundleLocalizations"; pb "Add :CFBundleLocalizations array"; pb "Add :CFBundleLocalizations:0 string tr"
          # App Store'da dil "Türkçe" görünsün: proje geliştirme dili tr
          sed -i '' 's/developmentRegion = en;/developmentRegion = tr;/' ios/App/App.xcodeproj/project.pbxproj || true
          echo "Info.plist hazır"
      - name: İmza profilleri
        script: xcode-project use-profiles
      - name: Sürüm numarası
        script: |
          cd ios/App
          agvtool new-version -all ${BUILD_NUMBER:-1}
          agvtool new-marketing-version 1.0.4
      - name: iOS uygulamasını paketle
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - app/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - bulmacacarki.destek@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true

